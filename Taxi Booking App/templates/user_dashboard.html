<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaxiGo - User Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
        }
        .navbar {
            background-color: #6610f2;
            padding: 1rem;
        }
        .navbar-brand {
            color: white !important;
            font-weight: 600;
        }
        .navbar-toggler {
            border-color: rgba(255, 255, 255, 0.5);
        }
        .navbar-toggler-icon {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba%28255, 255, 255, 0.7%29' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
        }
        .nav-link {
            color: rgba(255, 255, 255, 0.8) !important;
            transition: color 0.3s ease;
        }
        .nav-link:hover {
            color: white !important;
        }
        .dashboard-container {
            padding: 2rem;
        }
        .booking-card, .rides-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            margin-bottom: 2rem;
            transition: transform 0.3s ease;
        }
        .booking-card:hover, .rides-card:hover {
            transform: translateY(-5px);
        }
        .form-label {
            font-weight: 500;
            color: #495057;
        }
        .btn-book {
            background-color: #6610f2;
            border: none;
            padding: 0.75rem 2rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .btn-book:hover {
            background-color: #520dc2;
            transform: translateY(-2px);
        }
        .btn-book:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }
        .ride-status {
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .status-requested {
            background-color: #ffd700;
            color: #000;
        }
        .status-accepted {
            background-color: #007bff;
            color: white;
        }
        .status-in_progress {
            background-color: #17a2b8;
            color: white;
        }
        .status-completed {
            background-color: #28a745;
            color: white;
        }
        .status-cancelled {
            background-color: #dc3545;
            color: white;
        }
        .loading {
            position: relative;
            pointer-events: none;
        }
        .loading::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: inherit;
        }
        .spinner {
            width: 1rem;
            height: 1rem;
            margin-right: 0.5rem;
            border: 2px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .location-input {
            position: relative;
        }
        .location-input .form-control {
            padding-left: 2.5rem;
        }
        .location-input i {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: #6c757d;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="fas fa-taxi me-2"></i>Taxi Booking</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="userProfile">
                            <i class="fas fa-user me-1"></i> Profile
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="logoutBtn">
                            <i class="fas fa-sign-out-alt me-1"></i> Logout
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Dashboard Content -->
    <div class="container dashboard-container">
        <div class="row">
            <!-- Booking Form -->
            <div class="col-md-6">
                <div class="booking-card">
                    <h3 class="mb-4"><i class="fas fa-route me-2"></i>Book a Ride</h3>
                    <form id="bookingForm">
                        <div class="mb-3">
                            <label class="form-label">Pickup Location</label>
                            <div class="row">
                                <div class="col-6">
                                    <div class="location-input">
                                        <i class="fas fa-map-marker-alt"></i>
                                        <input type="number" class="form-control" id="pickupLat" name="pickup_lat" 
                                               placeholder="Latitude" step="any" required>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="location-input">
                                        <i class="fas fa-map-marker-alt"></i>
                                        <input type="number" class="form-control" id="pickupLon" name="pickup_lon" 
                                               placeholder="Longitude" step="any" required>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Dropoff Location</label>
                            <div class="row">
                                <div class="col-6">
                                    <div class="location-input">
                                        <i class="fas fa-map-marker-alt"></i>
                                        <input type="number" class="form-control" id="dropoffLat" name="dropoff_lat" 
                                               placeholder="Latitude" step="any" required>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="location-input">
                                        <i class="fas fa-map-marker-alt"></i>
                                        <input type="number" class="form-control" id="dropoffLon" name="dropoff_lon" 
                                               placeholder="Longitude" step="any" required>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary btn-book" id="bookBtn">
                            <span class="d-flex align-items-center justify-content-center">
                                Book Now
                            </span>
                        </button>
                    </form>
                </div>
            </div>

            <!-- Recent Rides -->
            <div class="col-md-6">
                <div class="rides-card">
                    <h3 class="mb-4"><i class="fas fa-history me-2"></i>Recent Rides</h3>
                    <div id="ridesList">
                        <div class="text-center py-4">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Check if user is logged in
        document.addEventListener('DOMContentLoaded', function() {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = '/';
            }
        });

        // Handle logout
        document.getElementById('logoutBtn').addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.removeItem('token');
            window.location.href = '/';
        });

        // Handle ride booking
        document.getElementById('bookingForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const bookBtn = document.getElementById('bookBtn');
            const originalContent = bookBtn.innerHTML;
            
            try {
                // Show loading state
                bookBtn.disabled = true;
                bookBtn.innerHTML = `
                    <span class="d-flex align-items-center justify-content-center">
                        <div class="spinner"></div>
                        Booking...
                    </span>
                `;

                const formData = {
                    pickup_lat: parseFloat(document.getElementById('pickupLat').value),
                    pickup_lon: parseFloat(document.getElementById('pickupLon').value),
                    dropoff_lat: parseFloat(document.getElementById('dropoffLat').value),
                    dropoff_lon: parseFloat(document.getElementById('dropoffLon').value)
                };

                const response = await fetch('/ride/request', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();
                if (response.ok) {
                    showToast('Success', 'Ride booked successfully!', 'success');
                    this.reset();
                    loadRecentRides();
                } else {
                    showToast('Error', data.error || 'Failed to book ride', 'error');
                }
            } catch (error) {
                showToast('Error', 'An error occurred while booking the ride', 'error');
            } finally {
                // Restore button state
                bookBtn.disabled = false;
                bookBtn.innerHTML = originalContent;
            }
        });

        // Load recent rides
        async function loadRecentRides() {
            const ridesList = document.getElementById('ridesList');
            
            try {
                console.log('Fetching ride history...');
                const response = await fetch('/ride/history', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });

                console.log('Response:', response);
                const data = await response.json();
                console.log('Ride history data:', data);

                if (response.ok && data.rides) {
                    const statusIcons = {
                        'REQUESTED': 'clock',
                        'ACCEPTED': 'check-circle',
                        'IN_PROGRESS': 'car',
                        'COMPLETED': 'flag-checkered',
                        'CANCELLED': 'times-circle'
                    };

                    if (data.rides.length === 0) {
                        ridesList.innerHTML = '<p class="text-muted text-center">No rides yet</p>';
                        return;
                    }

                    ridesList.innerHTML = data.rides.map(ride => `
                        <div class="card mb-3">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <h6 class="card-subtitle text-muted">Ride #${ride.RideID}</h6>
                                    <span class="ride-status status-${ride.Status.toLowerCase()}">
                                        <i class="fas fa-${statusIcons[ride.Status.toUpperCase()] || 'question-circle'}"></i>
                                        ${ride.Status}
                                    </span>
                                </div>
                                <p class="card-text mb-1">
                                    <i class="fas fa-map-marker-alt text-primary me-2"></i>
                                    <small>Pickup: ${ride.PickupLat}, ${ride.PickupLon}</small>
                                </p>
                                <p class="card-text mb-1">
                                    <i class="fas fa-map-marker-alt text-success me-2"></i>
                                    <small>Dropoff: ${ride.DropoffLat}, ${ride.DropoffLon}</small>
                                </p>
                                <p class="card-text">
                                    <i class="fas fa-rupee-sign me-2"></i>
                                    <small class="text-muted">Fare: ₹${ride.Fare}</small>
                                </p>
                                <p class="card-text mt-2">
                                    <i class="fas fa-calendar me-2"></i>
                                    <small class="text-muted">Requested: ${new Date(ride.RequestedAt).toLocaleString()}</small>
                                </p>
                            </div>
                        </div>
                    `).join('');
                } else {
                    throw new Error(data.error || 'Failed to load rides');
                }
            } catch (error) {
                console.error('Error loading rides:', error);
                ridesList.innerHTML = `
                    <div class="alert alert-danger" role="alert">
                        <i class="fas fa-exclamation-circle me-2"></i>
                        Failed to load rides. Please try again later.
                    </div>
                `;
            }
        }

        // Toast notification function
        function showToast(title, message, type) {
            // Create toast container if it doesn't exist
            let toastContainer = document.querySelector('.toast-container');
            if (!toastContainer) {
                toastContainer = document.createElement('div');
                toastContainer.className = 'toast-container position-fixed bottom-0 end-0 p-3';
                document.body.appendChild(toastContainer);
            }

            const toast = document.createElement('div');
            toast.className = `toast align-items-center text-white bg-${type === 'success' ? 'success' : 'danger'} border-0`;
            toast.setAttribute('role', 'alert');
            toast.setAttribute('aria-live', 'assertive');
            toast.setAttribute('aria-atomic', 'true');

            toast.innerHTML = `
                <div class="d-flex">
                    <div class="toast-body">
                        <strong>${title}:</strong> ${message}
                    </div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                </div>
            `;

            toastContainer.appendChild(toast);
            const bsToast = new bootstrap.Toast(toast);
            bsToast.show();

            // Remove toast after it's hidden
            toast.addEventListener('hidden.bs.toast', () => {
                toast.remove();
            });
        }

        // Call loadRecentRides when the page loads
        document.addEventListener('DOMContentLoaded', function() {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = '/';
            } else {
                loadRecentRides();
            }
        });
    </script>
</body>
</html>
