<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taxi Booking - Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <ul class="nav nav-tabs" id="authTabs">
            <li class="nav-item">
                <a class="nav-link" href="/login">Login</a>
            </li>
            <li class="nav-item">
                <a class="nav-link active" href="/register">Register</a>
            </li>
        </ul>

        <div class="tab-content mt-3">
            <div class="tab-pane active">
                <form id="registerForm" class="needs-validation" novalidate>
                    <div class="mb-3">
                        <label for="register-name" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="register-name" required>
                    </div>

                    <div class="mb-3">
                        <label for="register-email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="register-email" required>
                    </div>

                    <div class="mb-3">
                        <label for="register-phone" class="form-label">Phone</label>
                        <input type="tel" class="form-control" id="register-phone" pattern="[0-9]{10}" required>
                        <div class="form-text">Enter 10 digit phone number</div>
                    </div>

                    <div class="mb-3">
                        <label for="register-birth" class="form-label">Date of Birth</label>
                        <input type="date" class="form-control" id="register-birth" required>
                    </div>

                    <div class="mb-3">
                        <label for="register-gender" class="form-label">Gender</label>
                        <select class="form-select" id="register-gender" required>
                            <option value="">Select gender</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="register-password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="register-password" minlength="8" required>
                        <div class="form-text">Password must be at least 8 characters long</div>
                    </div>

                    <div class="mb-3">
                        <label for="register-role" class="form-label">Register as</label>
                        <select class="form-select" id="register-role" required>
                            <option value="">Select role</option>
                            <option value="user">Passenger</option>
                            <option value="driver">Driver</option>
                        </select>
                    </div>

                    <div id="driver-fields" class="d-none">
                        <div class="mb-3">
                            <label for="license-number" class="form-label">License Number</label>
                            <input type="text" class="form-control" id="license-number">
                            <div class="form-text">Enter your driver's license number</div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="license-plate" class="form-label">License Plate Number</label>
                            <input type="text" class="form-control" id="license-plate">
                            <div class="form-text">Enter your vehicle's license plate number</div>
                        </div>

                        <div class="mb-3">
                            <label for="vehicle-type" class="form-label">Vehicle Type</label>
                            <select class="form-select" id="vehicle-type">
                                <option value="">Select vehicle type</option>
                                <option value="sedan">Sedan</option>
                                <option value="suv">SUV</option>
                                <option value="van">Van</option>
                                <option value="hatchback">Hatchback</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">Register</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/api.js" type="module"></script>
    <script src="/static/js/auth.js" type="module"></script>
    <script>
        // Show/hide driver fields based on role selection
        document.getElementById('register-role').addEventListener('change', function() {
            const driverFields = document.getElementById('driver-fields');
            const licensePlateInput = document.getElementById('license-plate');
            const licenseNumberInput = document.getElementById('license-number');
            const vehicleTypeInput = document.getElementById('vehicle-type');
            
            if (this.value === 'driver') {
                driverFields.classList.remove('d-none');
                licensePlateInput.required = true;
                licenseNumberInput.required = true;
                vehicleTypeInput.required = true;
            } else {
                driverFields.classList.add('d-none');
                licensePlateInput.required = false;
                licenseNumberInput.required = false;
                vehicleTypeInput.required = false;
            }
        });

        // Form validation
        document.getElementById('registerForm').addEventListener('submit', function(event) {
            if (!this.checkValidity()) {
                event.preventDefault();
                event.stopPropagation();
            }
            this.classList.add('was-validated');
        });
    </script>
</body>
</html>
