<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaxiGo - Login/Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div class="container">
        <div class="auth-card">
            <h1>Taxi Booking System</h1>
            
            <!-- Auth Type Toggle -->
            <div class="auth-toggle">
                <button class="toggle-btn active" onclick="toggleAuth('login')">Login</button>
                <button class="toggle-btn" onclick="toggleAuth('register')">Register</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="password" required>
                </div>
                <div class="form-group">
                    <label for="login-role">Role</label>
                    <select id="login-role" name="role" required>
                        <option value="user">User</option>
                        <option value="driver">Driver</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary">Login</button>
            </form>

            <!-- Registration Form -->
            <form id="registerForm" class="auth-form" style="display: none;">
                <div class="form-group">
                    <label for="reg-role">Register as</label>
                    <select id="reg-role" name="role" required onchange="toggleRegistrationFields()">
                        <option value="user">User</option>
                        <option value="driver">Driver</option>
                    </select>
                </div>
                <!-- Common Fields -->
                <div class="form-group">
                    <label for="reg-name">Full Name</label>
                    <input type="text" id="reg-name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="reg-email">Email</label>
                    <input type="email" id="reg-email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="reg-phone">Phone</label>
                    <input type="tel" id="reg-phone" name="phone" required>
                </div>
                <div class="form-group">
                    <label for="reg-password">Password</label>
                    <input type="password" id="reg-password" name="password" required>
                </div>
                <div class="form-group">
                    <label for="reg-confirm-password">Confirm Password</label>
                    <input type="password" id="reg-confirm-password" name="confirm_password" required>
                </div>
                <div class="form-group">
                    <label for="reg-birth">Date of Birth</label>
                    <input type="date" id="reg-birth" name="birth" required>
                </div>
                <div class="form-group">
                    <label for="reg-gender">Gender</label>
                    <select id="reg-gender" name="gender" required>
                        <option value="">Select Gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <!-- Driver-specific Fields -->
                <div id="driver-fields" style="display: none;">
                    <div class="form-group">
                        <label for="reg-license">License Number</label>
                        <input type="text" id="reg-license" name="license_number">
                    </div>
                    <div class="form-group">
                        <label for="reg-plate">Vehicle License Plate</label>
                        <input type="text" id="reg-plate" name="license_plate">
                    </div>
                    <div class="form-group">
                        <label for="reg-vehicle-type">Vehicle Type</label>
                        <select id="reg-vehicle-type" name="vehicle_type_id" required>
                            <option value="">Select Vehicle Type</option>
                            <option value="1">Sedan - 4-door car, comfortable for up to 4</option>
                            <option value="2">SUV - Spacious vehicle, ideal for 6</option>
                            <option value="3">Luxury - Premium vehicle with high-end service</option>
                            <option value="4">Compact - Economic choice for 1-3 passengers</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn-primary">Register</button>
            </form>
            <div id="error-message" class="error-message"></div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
