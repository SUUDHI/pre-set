<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taxi Booking System - Driver Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <i class="fas fa-taxi"></i>
            <span>TaxiGo</span>
        </div>
        <div class="user-info">
            <span id="userEmail"></span>
            <button onclick="logout()" class="btn-secondary">Logout</button>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <h2>Update Location</h2>
            <form id="locationForm" class="form-group">
                <div class="input-group">
                    <label>Current Location</label>
                    <input type="number" id="latitude" placeholder="Latitude" step="any" required>
                    <input type="number" id="longitude" placeholder="Longitude" step="any" required>
                </div>
                <button type="submit" class="btn-primary">Update Location</button>
            </form>

            <div class="status-section">
                <label>Status:</label>
                <select id="driverStatus" class="form-control">
                    <option value="available">Available</option>
                    <option value="busy">Busy</option>
                    <option value="offline">Offline</option>
                </select>
            </div>
        </div>

        <div class="card">
            <h2>Ride Requests</h2>
            <div id="requestsTableBody" class="ride-list">
                <!-- Ride requests will be loaded here -->
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    <script src="{{ url_for('static', filename='js/driver-dashboard.js') }}"></script>
</body>
</html>
