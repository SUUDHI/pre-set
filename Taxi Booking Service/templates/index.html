<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taxi Booking - Home</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
        }
        .container {
            max-width: 400px;
            margin: auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 2px 2px 12px rgba(0, 0, 0, 0.1);
        }
        input, button {
            width: 100%;
            margin: 10px 0;
            padding: 10px;
            font-size: 16px;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <h1>Welcome to Taxi Booking</h1>

    <!-- User Login -->
    <div class="container">
        <h2>User Login</h2>
        <input type="email" id="user-email" placeholder="Email" required>
        <input type="password" id="user-password" placeholder="Password" required>
        <button onclick="login('user')">Login</button>
        <p id="user-error-message" style="color: red;"></p>
        <p>Don't have an account? 
            <a href="{{ url_for('register_page') }}">Register as User</a> or 
            <a href="{{ url_for('register_driver_page') }}">Register as Driver</a>
            
        </p>
    </div>

    <!-- Driver Login -->
    <div class="container">
        <h2>Driver Login</h2>
        <input type="email" id="driver-email" placeholder="Email" required>
        <input type="password" id="driver-password" placeholder="Password" required>
        <button onclick="loginDriver()">Login as Driver</button>
        <p id="driver-error-message" style="color: red;"></p>
    </div>
    
    <script>
        async function loginDriver() {
            const email = document.getElementById("driver-email").value;
            const password = document.getElementById("driver-password").value;
            const errorMessage = document.getElementById("driver-error-message");
        
            const response = await fetch("/driver/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ Driver_email: email, Password: password })
            });
        
            const data = await response.json();
            
            if (response.ok) {
                alert("Login successful!");
                // Redirect to Driver Dashboard with driver_id from response
                window.location.href = `/driver/dashboard?driver_id=${data.DriverID}`;
            } else {
                errorMessage.textContent = data.message || "Invalid login credentials!";
            }
        }
        </script>
    
</body>
</html>
