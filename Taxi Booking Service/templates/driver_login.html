<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
        }
        .container {
            max-width: 400px;
            margin: auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 2px 2px 12px rgba(0, 0, 0, 0.1);
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #218838;
        }
    </style>
</head>
<body>
    <h1>Driver Login</h1>
    <div class="container">
        <input type="email" id="driver-email" placeholder="Enter your email">
        <input type="password" id="driver-password" placeholder="Enter your password">
        <button onclick="driverLogin()">Login</button>
        <p id="driver-error-message" style="color: red;"></p>
    </div>

    <script>
        async function driverLogin() {
            const email = document.getElementById("driver-email").value;
            const password = document.getElementById("driver-password").value;
            const errorMessage = document.getElementById("driver-error-message");

            const response = await fetch("/driver/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: email, password: password }) 
            });

            const data = await response.json();
            console.log("Login Response:", data);

            if (response.ok) {
                alert("Login successful!");
                window.location.href = "/driver/dashboard?driver_id=" + data.DriverID;
            } else {
                errorMessage.innerText = data.error;
            }
        }
    </script>
</body>
</html>
