<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Registration</title>
</head>
<body>
    <h2>Driver Registration</h2>
    <form id="driverRegisterForm">
        <label for="driver_name">Name:</label>
        <input type="text" id="driver_name" required><br>

        <label for="driver_phone">Phone:</label>
        <input type="text" id="driver_phone" required><br>

        <label for="driver_email">Email:</label>
        <input type="email" id="driver_email" required><br>

        <label for="password">Password:</label>
        <input type="password" id="password" required><br>

        <label for="birth_date">Birth Date:</label>
        <input type="date" id="birth_date" required><br>

        <label for="license_plate">License Plate:</label>
        <input type="text" id="license_plate" required><br>

        <label for="gender">Gender:</label>
        <select id="gender">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
        </select><br>

        <button type="submit">Register</button>
    </form>

    <p id="message"></p>

    <script>
        document.getElementById("driverRegisterForm").addEventListener("submit", async function(event) {
            event.preventDefault();

            const data = {
                Driver_name: document.getElementById("driver_name").value,
                Driver_phone: document.getElementById("driver_phone").value,
                Driver_email: document.getElementById("driver_email").value,
                Password: document.getElementById("password").value,
                Driver_birth: document.getElementById("birth_date").value,
                Driver_licensePlate: document.getElementById("license_plate").value,
                Driver_gender: document.getElementById("gender").value
            };

            const response = await fetch("/driver/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });

            const result = await response.json();
            document.getElementById("message").innerText = result.message || result.error;
        });
    </script>
</body>
</html>
