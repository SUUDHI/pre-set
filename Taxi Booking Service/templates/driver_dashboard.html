<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
        }
        .container {
            max-width: 400px;
            margin: auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 2px 2px 12px rgba(0, 0, 0, 0.1);
        }
        button {
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h1>Welcome, {{ driver['Driver_Name'] }}</h1>
    <div class="container">
        <h2>Driver Details</h2>
        <p><strong>Email:</strong> {{ driver['Driver_email'] }}</p>
        <p><strong>Phone:</strong> {{ driver['Driver_phone'] }}</p>
        <p><strong>Status:</strong> <span id="status">{{ driver['Status'] }}</span></p>

    </div>
</body>
</html>
